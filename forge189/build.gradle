buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '3.0.32'
group = 'dev.ghostfusion'
archivesBaseName = 'ghostc-forge189'

sourceCompatibility = targetCompatibility = 1.8

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
    makeObfSourceJar = false
}

sourceSets {
    main {
        java {
            // Include the clean-room, Minecraft-independent core and host driver.
            srcDir '../src/main/java'
        }
    }
}

compileJava.options.encoding = 'UTF-8'


// Java 8 native-boundary probe: genuine 1.8.9 packet classes and Netty
// EmbeddedChannel under the ForgeGradle dependency classpath. No game launch.
task velocityNativeProbe(type: JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    main = 'dev.ghostfusion.forge189.VelocityPacketNativeTests'
}
check.dependsOn velocityNativeProbe

// R3.46 mandatory native 1.8.9 combined module admission probe. Uses the
// real Minecraft ContainerChest/Items and Netty classes with shared policy;
// does not launch Minecraft, mutate a game profile or join a server.
task nativeTandemProbe(type: JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    main = 'dev.ghostfusion.forge189.NativeTandemAcceptanceTests'
}
check.dependsOn nativeTandemProbe


// R3.50 mandatory native Minecraft 1.8.9 crosshair ray/AABB probe.
// This exercises genuine Forge dependency classes on both Linux/Windows
// JDK8 without claiming an original Minecraft application/gameplay launch.
task nativeRayProbe(type: JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    main = 'dev.ghostfusion.forge189.NativeCrosshairRayTests'
}
check.dependsOn nativeRayProbe


