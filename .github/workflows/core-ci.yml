          java -cp .build/classes:.build/tests dev.ghostfusion.tests.EspTelemetryTests | tee .build/esp-telemetry.log
          grep -q 'ESP_TELEMETRY_PASS' .build/esp-telemetry.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.EspDrawLimitTests | tee .build/esp-draw-limit.log
          grep -q 'ESP_DRAW_LIMIT_PASS' .build/esp-draw-limit.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.EspLosPruningTests | tee .build/esp-los-pruning.log
          grep -q 'ESP_LOS_PRUNING_PASS' .build/esp-los-pruning.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.EspNearestBudgetTests | tee .build/esp-nearest.log
          grep -q 'ESP_NEAREST_BUDGET_PASS' .build/esp-nearest.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.EspLineColorTests | tee .build/esp-color.log
          grep -q 'ESP_LINE_COLOR_PASS' .build/esp-color.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.EspHealthPlacementTests | tee .build/esp-health-placement.log
          grep -q 'ESP_HEALTH_PLACEMENT_PASS' .build/esp-health-placement.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.EspHealthBarTests | tee .build/esp-health-bar.log
          grep -q 'ESP_HEALTH_BAR_PASS' .build/esp-health-bar.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.EspTeamPolicyTests | tee .build/esp-team-policy.log
          grep -q 'ESP_TEAM_POLICY_PASS' .build/esp-team-policy.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.EspLivePaintGateTests | tee .build/esp-live-paint.log
          grep -q 'ESP_LIVE_PAINT_GATE_PASS' .build/esp-live-paint.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.EspDistanceFadeTests | tee .build/esp-distance-fade.log
          grep -q 'ESP_DISTANCE_FADE_PASS' .build/esp-distance-fade.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.EspBlendOrderTests | tee .build/esp-blend-order.log
          grep -q 'ESP_BLEND_ORDER_PASS' .build/esp-blend-order.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.EspFilledBoxTests | tee .build/esp-filled-box.log
          grep -q 'ESP_FILLED_BOX_PASS' .build/esp-filled-box.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.EspCornerBoxTests | tee .build/esp-corner.log
          grep -q 'ESP_CORNER_BOX_PASS' .build/esp-corner.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.EspSkeletonTests | tee .build/esp-skeleton.log
          grep -q 'ESP_SKELETON_PASS' .build/esp-skeleton.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.CombatTests | tee .build/combat.log
          grep -q 'COMBAT_REGRESSION_PASS' .build/combat.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.LiveCombatTargetGateTests | tee .build/live-combat-target.log
          grep -q 'LIVE_COMBAT_TARGET_GATE_PASS' .build/live-combat-target.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.CombatIsolationTests | tee .build/combat-isolation.log
          grep -q 'COMBAT_ISOLATION_PASS' .build/combat-isolation.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.SnapshotRankIndexTests | tee .build/snapshot-rank-index.log
          grep -q 'SNAPSHOT_RANK_INDEX_PASS' .build/snapshot-rank-index.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.SnapshotModeTests | tee .build/snapshot-mode.log
          grep -q 'SNAPSHOT_MODE_PASS' .build/snapshot-mode.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.SnapshotTelemetryTests | tee .build/snapshot-telemetry.log
          grep -q 'SNAPSHOT_TELEMETRY_PASS' .build/snapshot-telemetry.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.TargetHotPathTests | tee .build/target-hot-path.log
          grep -q 'TARGET_HOT_PATH_PASS' .build/target-hot-path.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.SnapshotDemandTests | tee .build/snapshot-demand.log
          grep -q 'SNAPSHOT_DEMAND_PASS' .build/snapshot-demand.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.VisibilitySnapshotTests | tee .build/visibility-snapshot.log
          grep -q 'VISIBILITY_SNAPSHOT_PASS' .build/visibility-snapshot.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.NearestSnapshotTests | tee .build/nearest-snapshot.log
          grep -q 'NEAREST_SNAPSHOT_PASS' .build/nearest-snapshot.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.WorldLifecycleTests | tee .build/world-lifecycle.log
          grep -q 'WORLD_LIFECYCLE_PASS' .build/world-lifecycle.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.CombatMoreTests | tee .build/combat-more.log
          grep -q 'COMBAT_MORE_REGRESSION_PASS' .build/combat-more.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.PacketLifecycleReentryTests | tee .build/packet-lifecycle.log
          grep -q 'PACKET_LIFECYCLE_REENTRY_PASS' .build/packet-lifecycle.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.CoordinatorHygieneTests | tee .build/hygiene.log
          grep -q 'COORDINATOR_HYGIENE_PASS' .build/hygiene.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.RuntimeSafetyTests | tee .build/runtime-safety.log
          grep -q 'RUNTIME_SAFETY_PASS' .build/runtime-safety.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.DiagnosticsBackupIntegrityTests | tee .build/diagnostics-backup-integrity.log
          grep -q 'DIAGNOSTICS_BACKUP_INTEGRITY_PASS' .build/diagnostics-backup-integrity.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.FeatureFaultTests | tee .build/feature-fault.log
          grep -q 'FEATURE_FAULT_PASS' .build/feature-fault.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.FeatureFaultLifecycleReportingTests | tee .build/feature-fault-lifecycle.log
          grep -q 'FEATURE_FAULT_LIFECYCLE_REPORTING_PASS' .build/feature-fault-lifecycle.log
          python3 tools/test_forge_wiring.py
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.ViewportRuntimeTests | tee .build/viewport.log
          grep -q 'VIEWPORT_RUNTIME_PASS' .build/viewport.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.ViewportHitTests | tee .build/viewport-hit.log
          grep -q 'VIEWPORT_HIT_PASS' .build/viewport-hit.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.NumericSliderScaleTests | tee .build/numeric-slider-scale.log
          grep -q 'NUMERIC_SLIDER_SCALE_PASS' .build/numeric-slider-scale.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.GuiSliderDragTests | tee .build/gui-slider-drag.log
          grep -q 'GUI_SLIDER_DRAG_PASS' .build/gui-slider-drag.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.GuiScrollIndicatorTests | tee .build/gui-scroll-indicator.log
          grep -q 'GUI_SCROLL_INDICATOR_PASS' .build/gui-scroll-indicator.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.GuiSlateLayoutTests | tee .build/gui-slate-layout.log
          grep -q 'GUI_SLATE_LAYOUT_PASS' .build/gui-slate-layout.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.GuiSettingPresentationTests | tee .build/gui-setting-presentation.log
          grep -q 'GUI_SETTING_PRESENTATION_PASS' .build/gui-setting-presentation.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.GuiSlateWorkspaceTests | tee .build/gui-slate-workspace.log
          grep -q 'GUI_SLATE_WORKSPACE_PASS' .build/gui-slate-workspace.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.GuiChromeTests | tee .build/gui-chrome.log
          grep -q 'GUI_CHROME_PASS' .build/gui-chrome.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.GuiFooterTextTests | tee .build/gui-footer-text.log
          grep -q 'GUI_FOOTER_TEXT_PASS' .build/gui-footer-text.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.CompactGuiTests | tee .build/compact-gui.log
          grep -q 'COMPACT_GUI_PASS' .build/compact-gui.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.ReservedKeyTests | tee .build/reserved-key.log
          grep -q 'RESERVED_KEY_PASS' .build/reserved-key.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.PhysicalInputBindingTests | tee .build/physical-input-binding.log
          grep -q 'PHYSICAL_INPUT_BINDING_PASS' .build/physical-input-binding.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.HudPlacementTests | tee .build/hud-placement.log
          grep -q 'HUD_PLACEMENT_PASS' .build/hud-placement.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.HudPreviewArtTests | tee .build/hud-preview-art.log
          grep -q 'HUD_PREVIEW_ART_PASS' .build/hud-preview-art.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.HudOverlapPolicyTests | tee .build/hud-overlap.log
          grep -q 'HUD_OVERLAP_POLICY_PASS' .build/hud-overlap.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.HudSnapPolicyTests | tee .build/hud-snap.log
          grep -q 'HUD_SNAP_POLICY_PASS' .build/hud-snap.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.HudPreviewTests | tee .build/hud-preview.log
          grep -q 'HUD_PREVIEW_PASS' .build/hud-preview.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.HudEditorControlsTests | tee .build/hud-editor-controls.log
          grep -q 'HUD_EDITOR_CONTROLS_PASS' .build/hud-editor-controls.log
