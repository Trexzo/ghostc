name: Core CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-core:
    name: Java ${{ matrix.java }} - source, tests, demo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and test offline core and host
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_repository_inventory.py
          python3 tools/test_forge_build_manifest.py
          python3 tools/test_audit_native_acceptance.py
          mkdir -p .build/classes .build/tests
          find src/main/java -name '*.java' -print0 | xargs -0 javac --release 8 -d .build/classes
          find src/test/java -name '*.java' -print0 | xargs -0 javac --release 8 -cp .build/classes -d .build/tests
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.FaultRecoveryUiTests | tee .build/fault-recovery-ui.log
          grep -q 'FAULT_RECOVERY_UI_PASS' .build/fault-recovery-ui.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.ModuleLifecycleReentryTests | tee .build/module-lifecycle.log
          grep -q 'MODULE_LIFECYCLE_REENTRY_PASS' .build/module-lifecycle.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.EventPostLifecycleFaultTests | tee .build/event-post-lifecycle.log
          grep -q 'EVENT_POST_LIFECYCLE_FAULT_PASS' .build/event-post-lifecycle.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.TargetHudCrowdedTeamPinTests | tee .build/crowded-team-pin.log
          grep -q 'TARGET_HUD_CROWDED_TEAM_PIN_PASS' .build/crowded-team-pin.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.PinnedSnapshotTests | tee .build/pinned-snapshot.log
          grep -q 'PINNED_SNAPSHOT_PASS' .build/pinned-snapshot.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.TargetHudDistanceTextTests | tee .build/target-hud-distance.log
          grep -q 'TARGET_HUD_DISTANCE_PASS' .build/target-hud-distance.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.TargetHudTeamFilterTests | tee .build/target-hud-team.log
          grep -q 'TARGET_HUD_TEAM_FILTER_PASS' .build/target-hud-team.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.TargetHudSelectionTests | tee .build/target-hud-selection.log
          grep -q 'TARGET_HUD_SELECTION_PASS' .build/target-hud-selection.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.TargetHudMotionTests | tee .build/target-motion.log
          grep -q 'TARGET_HUD_MOTION_PASS' .build/target-motion.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.TargetHudModernLayoutTests | tee .build/target-hud-modern.log
          grep -q 'TARGET_HUD_MODERN_LAYOUT_PASS' .build/target-hud-modern.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.TargetHudPaletteTests | tee .build/target-hud-palette.log
          grep -q 'TARGET_HUD_PALETTE_PASS' .build/target-hud-palette.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.GuiSearchFocusTests | tee .build/gui-search-focus.log
          grep -q 'GUI_SEARCH_FOCUS_PASS' .build/gui-search-focus.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.GuiKeybindCaptureTests | tee .build/gui-keybind-capture.log
          grep -q 'GUI_KEYBIND_CAPTURE_PASS' .build/gui-keybind-capture.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.SettingDefaultResetTests | tee .build/setting-default-reset.log
          grep -q 'SETTING_DEFAULT_RESET_PASS' .build/setting-default-reset.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.GuiSettingKeyboardTests | tee .build/gui-setting-keyboard.log
          grep -q 'GUI_SETTING_KEYBOARD_PASS' .build/gui-setting-keyboard.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.GuiKeyboardNavigationTests | tee .build/gui-keyboard.log
          grep -q 'GUI_KEYBOARD_NAVIGATION_PASS' .build/gui-keyboard.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.CoreTests | tee .build/test.log
          grep -Eq '^CORE_REGRESSION_PASS assertions=[0-9]+$' .build/test.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.HostRuntimeTests | tee .build/host.log
          grep -q 'HOST_REGRESSION_PASS' .build/host.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.HostCloseInputFenceTests | tee .build/close-input-fence.log
          grep -q 'HOST_CLOSE_INPUT_FENCE_PASS' .build/close-input-fence.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.HostClosingEligibilityTests | tee .build/closing-eligibility.log
          grep -q 'HOST_CLOSING_ELIGIBILITY_PASS' .build/closing-eligibility.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.IngressDrainReentryTests | tee .build/ingress-drain-reentry.log
          grep -q 'INGRESS_DRAIN_REENTRY_PASS' .build/ingress-drain-reentry.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.IngressEpochAdmissionTests | tee .build/ingress-epoch-admission.log
          grep -q 'INGRESS_EPOCH_ADMISSION_PASS' .build/ingress-epoch-admission.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.StartupPersistenceFenceTests | tee .build/startup-persistence-fence.log
          grep -q 'STARTUP_PERSISTENCE_FENCE_PASS' .build/startup-persistence-fence.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.SlateLegacyMigrationTests | tee .build/slate-legacy.log
          grep -q 'SLATE_LEGACY_MIGRATION_PASS' .build/slate-legacy.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.GuiThemePaletteTests | tee .build/gui-theme.log
          grep -q 'GUI_THEME_PALETTE_PASS' .build/gui-theme.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.HudThemeTokensTests | tee .build/hud-theme-tokens.log
          grep -q 'HUD_THEME_TOKENS_PASS' .build/hud-theme-tokens.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.ModuleListEditorTests | tee .build/modulelist-editor.log
          grep -q 'MODULE_LIST_EDITOR_PASS' .build/modulelist-editor.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.ModuleListMotionTests | tee .build/modulelist-motion.log
          grep -q 'MODULE_LIST_MOTION_PASS' .build/modulelist-motion.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.ModuleListLayoutTests | tee .build/modulelist.log
