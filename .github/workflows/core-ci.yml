          java -cp .build/classes:.build/tests dev.ghostfusion.tests.HudLiveTargetGateTests | tee .build/hud-live-target.log
          grep -q 'HUD_LIVE_TARGET_GATE_PASS' .build/hud-live-target.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.TargetHudTextLayoutTests | tee .build/target-hud-text.log
          grep -q 'TARGET_HUD_TEXT_PASS' .build/target-hud-text.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.FeatureTests | tee .build/features.log
          grep -q 'FEATURE_REGRESSION_PASS' .build/features.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.LifecycleVisibilityTests | tee .build/lifecycle-visibility.log
