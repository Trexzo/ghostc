name: Core CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-core:
    name: Java ${{ matrix.java }} - source, tests, demo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and test offline core and host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/classes .build/tests
          find src/main/java -name '*.java' -print0 | xargs -0 javac --release 8 -d .build/classes
          find src/test/java -name '*.java' -print0 | xargs -0 javac --release 8 -cp .build/classes -d .build/tests
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.CoreTests | tee .build/test.log
          grep -q 'CORE_REGRESSION_PASS assertions=36' .build/test.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.HostRuntimeTests | tee .build/host.log
          grep -q 'HOST_REGRESSION_PASS' .build/host.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.UiTests | tee .build/ui.log
          grep -q 'UI_REGRESSION_PASS' .build/ui.log
          java -cp .build/classes:.build/tests dev.ghostfusion.tests.ServicesTests | tee .build/services.log
          grep -q 'SERVICES_REGRESSION_PASS' .build/services.log
          java -cp .build/classes dev.ghostfusion.demo.DemoMain | tee .build/demo.log
          grep -q 'DEMO_PASS' .build/demo.log
      - name: Package headless demonstrator
        if: matrix.java == '17'
        run: |
          mkdir -p dist
          printf 'Main-Class: dev.ghostfusion.demo.DemoMain\n' > .build/MANIFEST.MF
          jar cfm dist/ghostc-core-headless.jar .build/MANIFEST.MF -C .build/classes .
          sha256sum dist/ghostc-core-headless.jar > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: matrix.java == '17'
        with:
          name: ghostc-headless-core
          path: dist/
          if-no-files-found: error
