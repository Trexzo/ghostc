name: Forge 1.8.9 CI

on:
  push:
    branches: [main]
    paths:
      - "forge189/**"
      - "src/main/**"
      - ".github/workflows/forge189-ci.yml"
  pull_request:
    paths:
      - "forge189/**"
      - "src/main/**"
      - ".github/workflows/forge189-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge189:
    name: Forge 1.8.9 compile + reobfuscate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'
      - name: Build Forge 1.8.9 mod
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p forge189 build --stacktrace
          test -n "$(find forge189/build/libs -maxdepth 1 -name 'ghostc-forge189-*.jar' -print -quit)"
      - name: Inspect Forge development JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find forge189/build/libs -maxdepth 1 -name 'ghostc-forge189-*.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$JAR"
          jar tf "$JAR" > forge189/build/jar-contents.txt
          for entry in \
            mcmod.info \
            dev/ghostfusion/forge189/GhostCMod.class \
            dev/ghostfusion/forge189/ForgeEventAdapter.class \
            dev/ghostfusion/forge189/GhostClickGui.class \
            dev/ghostfusion/forge189/RenderStateGuard.class \
            dev/ghostfusion/ui/UiState.class \
            dev/ghostfusion/ui/UiSettingsStore.class \
            dev/ghostfusion/ui/UiActions.class \
            dev/ghostfusion/services/SessionServices.class \
            dev/ghostfusion/services/WorldSnapshot.class \
            dev/ghostfusion/services/TargetSelector.class \
            dev/ghostfusion/services/RotationCoordinator.class \
            dev/ghostfusion/services/ActionCoordinator.class \
            dev/ghostfusion/services/PacketCoordinator.class \
            dev/ghostfusion/services/InventoryCoordinator.class \
            dev/ghostfusion/features/FeatureModule.class \
            dev/ghostfusion/features/CpsMeter.class \
            dev/ghostfusion/features/SprintPolicy.class \
            dev/ghostfusion/features/TargetHudPolicy.class \
            dev/ghostfusion/features/AimAssistPolicy.class \
            dev/ghostfusion/features/FixedClickScheduler.class \
            dev/ghostfusion/features/BlockHitPolicy.class \
            dev/ghostfusion/features/HitSelectPolicy.class \
            dev/ghostfusion/features/PhysicalInputGate.class \
            dev/ghostfusion/host/RuntimeDiagnostics.class \
            dev/ghostfusion/host/FeatureFaultGuard.class \
            dev/ghostfusion/forge189/ForgeCombatController.class \
            dev/ghostfusion/forge189/ForgeFeatureDriver.class \
            dev/ghostfusion/forge189/PlayerEspRenderer.class \
            dev/ghostfusion/host/HostRuntime.class \
            dev/ghostfusion/core/ModuleRegistry.class \
            dev/ghostfusion/core/ProfileStore.class; do
            grep -Fxq "$entry" forge189/build/jar-contents.txt
          done
          javap -verbose -classpath "$JAR" dev.ghostfusion.forge189.GhostCMod | grep -q 'major version: 52'
          javap -verbose -classpath "$JAR" dev.ghostfusion.forge189.ForgeCombatController | grep -q 'major version: 52'
          VERSION=$(sed -n "s/^version = '\\([^']*\\)'/\\1/p" forge189/build.gradle | head -1)
          test -n "$VERSION"
          test "$(basename "$JAR")" = "ghostc-forge189-$VERSION.jar"
          unzip -p "$JAR" mcmod.info | grep -Fq "\"version\": \"$VERSION\""
          python3 tools/test_forge_wiring.py
          python3 tools/verify_forge_jar.py --selftest
          python3 tools/verify_forge_jar.py --jar "$JAR" --version "$VERSION"
          echo "FORGE189_JAR_STRUCTURE_PASS"
      - name: Checksums
        shell: bash
        run: |
          cd forge189/build/libs
          sha256sum ghostc-forge189-*.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ghostc-forge189-unverified-ingame
          path: |
            forge189/build/libs/ghostc-forge189-*.jar
            forge189/build/libs/SHA256SUMS.txt
            tools/Invoke-GhostCAcceptance.ps1
            docs/RUNTIME_R10.md
            docs/RUNTIME_R11.md
            docs/RUNTIME_R12.md
            docs/RUNTIME_R13.md
            docs/RUNTIME_R14.md
            docs/RUNTIME_R15.md
            docs/RUNTIME_R16.md
            docs/RUNTIME_R17.md
            docs/RUNTIME_R18.md
            docs/RUNTIME_R19.md
            docs/RUNTIME_R20.md
            docs/RUNTIME_R21.md
            docs/RUNTIME_R22.md
            docs/RUNTIME_R23.md
            docs/RUNTIME_R40.md
          if-no-files-found: error

  windows-forge189:
    name: Windows / JDK8 / Forge 1.8.9 build smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile, reobfuscate and inspect JAR on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gradle --no-daemon -p forge189 build --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'Forge 1.8.9 Windows compilation failed' }
          $config = Get-Content -LiteralPath forge189/build.gradle -Raw
          $match = [regex]::Match($config, "(?m)^version = '([^']+)'")
          if (!$match.Success) { throw 'Cannot parse Forge artifact version' }
          $version = $match.Groups[1].Value
          $file = Join-Path 'forge189/build/libs' "ghostc-forge189-$version.jar"
          if (!(Test-Path -LiteralPath $file)) { throw "Missing versioned JAR: $file" }
          $contents = & jar tf $file
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect JAR entries' }
          foreach ($class in @(
            'mcmod.info',
            'dev/ghostfusion/forge189/GhostCMod.class',
            'dev/ghostfusion/forge189/ForgeEventAdapter.class',
            'dev/ghostfusion/forge189/ForgeCombatController.class',
            'dev/ghostfusion/forge189/ForgeFeatureDriver.class',
            'dev/ghostfusion/host/HostRuntime.class',
            'dev/ghostfusion/host/FeatureFaultGuard.class',
            'dev/ghostfusion/host/RuntimeDiagnostics.class'
          )) {
            if ($contents -notcontains $class) { throw "Missing JAR entry: $class" }
          }
          $bytecode = (& javap -verbose -classpath $file dev.ghostfusion.forge189.GhostCMod) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $bytecode -notmatch 'major version: 52') {
            throw 'Forge entrypoint is not Java 8 bytecode'
          }
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $file)" | Set-Content -LiteralPath 'forge189/build/libs/SHA256SUMS.txt' -Encoding ascii
          python tools/test_forge_wiring.py
          if ($LASTEXITCODE -ne 0) { throw 'Forge feature integration contract failed' }
          python tools/verify_forge_jar.py --selftest
          if ($LASTEXITCODE -ne 0) { throw 'JAR verifier self-test failed' }
          python tools/verify_forge_jar.py --jar $file --version $version
          if ($LASTEXITCODE -ne 0) { throw 'JAR content verification failed' }
          Write-Output "WINDOWS_FORGE189_SMOKE_PASS version=$version"
      - name: Transactional install/collect/rollback rehearsal (fake profile, NO game launch)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ghostc-profile-fixture'
          $mods = Join-Path $root 'mods'
          New-Item -ItemType Directory -Path $mods -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root 'versions') -Force | Out-Null
          $previous = Join-Path $mods 'ghostc-forge189-0.9.0.jar'
          [IO.File]::WriteAllText($previous, 'OLDER OWNED GHOSTC TEST JAR')
          $priorHash = (Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash
          $config = Get-Content -LiteralPath 'forge189/build.gradle' -Raw
          $versionMatch = [regex]::Match($config, "(?m)^version = '([^']+)'")
          if (!$versionMatch.Success) { throw 'Cannot find current Forge artifact version' }
          $version = $versionMatch.Groups[1].Value
          $jar = (Resolve-Path "forge189/build/libs/ghostc-forge189-$version.jar").Path
          $hash = (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash
          $tool = (Resolve-Path 'tools/Invoke-GhostCAcceptance.ps1').Path
          $wrongHash = ('0' * 64)
          if ($wrongHash -eq $hash) { $wrongHash = ('F' * 64) }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Prepare -GameDir $root -JarPath $jar -ExpectedSha256 $wrongHash *> $null
          if ($LASTEXITCODE -eq 0 -or !(Test-Path -LiteralPath $previous) -or
              (Test-Path -LiteralPath (Join-Path $root 'ghostc-acceptance/install-state.json'))) {
            throw 'Wrong checksum was not safely rejected without changes'
          }
          $conflict = Join-Path $mods 'ghostc-unknown.jar'
          [IO.File]::WriteAllText($conflict, 'UNKNOWN GHOSTC FIXTURE')
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Prepare -GameDir $root -JarPath $jar -ExpectedSha256 $hash *> $null
          if ($LASTEXITCODE -eq 0 -or !(Test-Path -LiteralPath $previous)) {
            throw 'Duplicate named GhostC JAR was not safely rejected'
          }
          Remove-Item -LiteralPath $conflict
          Write-Output 'WINDOWS_ACCEPTANCE_NEGATIVE_PREFLIGHT_PASS'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Prepare -GameDir $root -JarPath $jar -ExpectedSha256 $hash
          if ($LASTEXITCODE -ne 0) { throw 'Prepare transaction failed' }
          if ((Test-Path -LiteralPath $previous) -or !(Test-Path -LiteralPath (Join-Path $root 'ghostc-acceptance/install-state.json'))) {
            throw 'Prepare failed to quarantine the old client safely'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Collect -GameDir $root
          if ($LASTEXITCODE -ne 0) { throw 'Collect evidence step failed' }
          $report = Join-Path $root 'ghostc-acceptance/acceptance-report.md'
          if (!(Test-Path -LiteralPath $report) -or
              ((Get-Content -LiteralPath $report -Raw) -notmatch 'UNVERIFIED IN-GAME')) {
            throw 'Acceptance report missing its unverified runtime disclaimer'
          }
          $installed = Join-Path $mods "ghostc-forge189-$version.jar"
          [IO.File]::AppendAllText($installed, 'TAMPERED FILE')
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Rollback -GameDir $root *> $null
          if ($LASTEXITCODE -eq 0 -or
              !(Test-Path -LiteralPath (Join-Path $root 'ghostc-acceptance/install-state.json'))) {
            throw 'Tampered installation did not block rollback'
          }
          Copy-Item -LiteralPath $jar -Destination $installed -Force
          if ((Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash -ne $hash) {
            throw 'Unable to restore test fixture before rollback'
          }
          Write-Output 'WINDOWS_ACCEPTANCE_TAMPER_GUARD_PASS'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Rollback -GameDir $root
          if ($LASTEXITCODE -ne 0) { throw 'Rollback transaction failed' }
          if (!(Test-Path -LiteralPath $previous) -or
              (Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash -ne $priorHash) {
            throw 'Rollback did not restore the original client byte-for-byte'
          }
          if ((Test-Path -LiteralPath (Join-Path $mods "ghostc-forge189-$version.jar")) -or
              (Test-Path -LiteralPath (Join-Path $root 'ghostc-acceptance/install-state.json'))) {
            throw 'Rollback left an active client or transaction state behind'
          }
          Write-Output 'WINDOWS_ACCEPTANCE_TRANSACTION_PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: ghostc-forge189-windows-build-unverified-ingame
          path: |
            forge189/build/libs/ghostc-forge189-*.jar
            forge189/build/libs/SHA256SUMS.txt
            tools/Invoke-GhostCAcceptance.ps1
            docs/RUNTIME_R10.md
            docs/RUNTIME_R15.md
            docs/RUNTIME_R16.md
            docs/RUNTIME_R23.md
            docs/RUNTIME_R40.md
          if-no-files-found: error
