name: Forge 1.8.9 CI

on:
  push:
    branches: [main]
    paths:
      - "forge189/**"
      - "src/main/**"
      - "src/test/**"
      - "tools/**"
      - ".github/workflows/forge189-ci.yml"
  pull_request:
    paths:
      - "forge189/**"
      - "src/main/**"
      - "src/test/**"
      - "tools/**"
      - ".github/workflows/forge189-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge189:
    name: Forge 1.8.9 compile + reobfuscate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'
      - name: Build Forge 1.8.9 mod
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p forge189 build --stacktrace
          test -n "$(find forge189/build/libs -maxdepth 1 -name 'ghostc-forge189-*.jar' -print -quit)"
      - name: Inspect Forge development JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find forge189/build/libs -maxdepth 1 -name 'ghostc-forge189-*.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$JAR"
          jar tf "$JAR" > forge189/build/jar-contents.txt
          for entry in \
            mcmod.info \
            dev/ghostfusion/forge189/GhostCMod.class \
            dev/ghostfusion/forge189/ForgeEventAdapter.class \
            dev/ghostfusion/forge189/GhostClickGui.class \
            dev/ghostfusion/forge189/RenderStateGuard.class \
            dev/ghostfusion/ui/UiState.class \
            dev/ghostfusion/ui/UiSettingsStore.class \
            dev/ghostfusion/ui/UiActions.class \
            dev/ghostfusion/services/SessionServices.class \
            dev/ghostfusion/services/WorldSnapshot.class \
            dev/ghostfusion/services/TargetSelector.class \
            dev/ghostfusion/services/RotationCoordinator.class \
            dev/ghostfusion/services/ActionCoordinator.class \
            dev/ghostfusion/services/PacketCoordinator.class \
            dev/ghostfusion/services/InventoryCoordinator.class \
            dev/ghostfusion/features/FeatureModule.class \
            dev/ghostfusion/features/CpsMeter.class \
            dev/ghostfusion/features/SprintPolicy.class \
            dev/ghostfusion/features/TargetHudPolicy.class \
            dev/ghostfusion/features/AimAssistPolicy.class \
            dev/ghostfusion/features/FixedClickScheduler.class \
            dev/ghostfusion/features/BlockHitPolicy.class \
            dev/ghostfusion/features/HitSelectPolicy.class \
            dev/ghostfusion/features/PhysicalInputGate.class \
            dev/ghostfusion/host/RuntimeDiagnostics.class \
            dev/ghostfusion/host/FeatureFaultGuard.class \
            dev/ghostfusion/forge189/ForgeCombatController.class \
            dev/ghostfusion/forge189/ForgeFeatureDriver.class \
            dev/ghostfusion/forge189/PlayerEspRenderer.class \
            dev/ghostfusion/host/HostRuntime.class \
            dev/ghostfusion/core/ModuleRegistry.class \
            dev/ghostfusion/core/ProfileStore.class; do
            grep -Fxq "$entry" forge189/build/jar-contents.txt
          done
          javap -verbose -classpath "$JAR" dev.ghostfusion.forge189.GhostCMod | grep -q 'major version: 52'
          javap -verbose -classpath "$JAR" dev.ghostfusion.forge189.ForgeCombatController | grep -q 'major version: 52'
          VERSION=$(sed -n "s/^version = '\\([^']*\\)'/\\1/p" forge189/build.gradle | head -1)
          test -n "$VERSION"
          test "$(basename "$JAR")" = "ghostc-forge189-$VERSION.jar"
          unzip -p "$JAR" mcmod.info | grep -Fq "\"version\": \"$VERSION\""
          python3 tools/test_forge_wiring.py
          python3 tools/verify_forge_jar.py --selftest
          python3 tools/verify_forge_jar.py --jar "$JAR" --version "$VERSION"
          echo "FORGE189_JAR_STRUCTURE_PASS"
      - name: Checksums
        shell: bash
        run: |
          cd forge189/build/libs
          sha256sum ghostc-forge189-*.jar > SHA256SUMS.txt
      - name: Verify release provenance against checked-out commit (NOT gameplay)
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find forge189/build/libs -maxdepth 1 -name 'ghostc-forge189-*.jar' ! -name '*-sources.jar' -print -quit)
          VERSION=$(awk -F"'" '/^version = / {print $2; exit}' forge189/build.gradle)
          REVISION=$(git rev-parse HEAD)
          python3 tools/test_forge_build_manifest.py
          python3 tools/forge_build_manifest.py create --jar "$JAR" --version "$VERSION" --sha256sums forge189/build/libs/SHA256SUMS.txt --manifest forge189/build/libs/GHOSTC_BUILD_MANIFEST.json --revision "$REVISION" --platform linux
          python3 tools/forge_build_manifest.py verify --jar "$JAR" --sha256sums forge189/build/libs/SHA256SUMS.txt --manifest forge189/build/libs/GHOSTC_BUILD_MANIFEST.json --revision "$REVISION" --platform linux
      - uses: actions/upload-artifact@v4
        with:
          name: ghostc-forge189-unverified-ingame
          path: |
            forge189/build/libs/ghostc-forge189-*.jar
            forge189/build/libs/SHA256SUMS.txt
            forge189/build/libs/GHOSTC_BUILD_MANIFEST.json
            tools/forge_build_manifest.py
            tools/verify_forge_jar.py
            tools/Invoke-GhostCAcceptance.ps1
            docs/RUNTIME_R10.md
            docs/RUNTIME_R11.md
            docs/RUNTIME_R12.md
            docs/RUNTIME_R13.md
            docs/RUNTIME_R14.md
            docs/RUNTIME_R15.md
            docs/RUNTIME_R16.md
            docs/RUNTIME_R17.md
            docs/RUNTIME_R18.md
            docs/RUNTIME_R19.md
            docs/RUNTIME_R20.md
            docs/RUNTIME_R21.md
            docs/RUNTIME_R22.md
            docs/RUNTIME_R23.md
            docs/RUNTIME_R55.md
          if-no-files-found: error

  windows-forge189:
    name: Windows / JDK8 / Forge 1.8.9 build smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile, reobfuscate and inspect JAR on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gradle --no-daemon -p forge189 build --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'Forge 1.8.9 Windows compilation failed' }
          $config = Get-Content -LiteralPath forge189/build.gradle -Raw
          $match = [regex]::Match($config, "(?m)^version = '([^']+)'")
          if (!$match.Success) { throw 'Cannot parse Forge artifact version' }
          $version = $match.Groups[1].Value
          $file = Join-Path 'forge189/build/libs' "ghostc-forge189-$version.jar"
          if (!(Test-Path -LiteralPath $file)) { throw "Missing versioned JAR: $file" }
          $contents = & jar tf $file
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect JAR entries' }
          foreach ($class in @(
            'mcmod.info',
            'dev/ghostfusion/forge189/GhostCMod.class',
            'dev/ghostfusion/forge189/ForgeEventAdapter.class',
            'dev/ghostfusion/forge189/ForgeCombatController.class',
            'dev/ghostfusion/forge189/ForgeFeatureDriver.class',
            'dev/ghostfusion/host/HostRuntime.class',
            'dev/ghostfusion/host/FeatureFaultGuard.class',
            'dev/ghostfusion/host/RuntimeDiagnostics.class'
          )) {
            if ($contents -notcontains $class) { throw "Missing JAR entry: $class" }
          }
          $bytecode = (& javap -verbose -classpath $file dev.ghostfusion.forge189.GhostCMod) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $bytecode -notmatch 'major version: 52') {
            throw 'Forge entrypoint is not Java 8 bytecode'
          }
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $file)" | Set-Content -LiteralPath 'forge189/build/libs/SHA256SUMS.txt' -Encoding ascii
          python tools/test_forge_wiring.py
          if ($LASTEXITCODE -ne 0) { throw 'Forge feature integration contract failed' }
          python tools/verify_forge_jar.py --selftest
          if ($LASTEXITCODE -ne 0) { throw 'JAR verifier self-test failed' }
          python tools/verify_forge_jar.py --jar $file --version $version
          if ($LASTEXITCODE -ne 0) { throw 'JAR content verification failed' }
          Write-Output "WINDOWS_FORGE189_SMOKE_PASS version=$version"
      - name: Verify Windows build provenance (NOT gameplay)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/test_forge_build_manifest.py
          if ($LASTEXITCODE -ne 0) { throw 'Provenance self-tests failed' }
          $config = Get-Content -LiteralPath forge189/build.gradle -Raw
          $version = ([regex]::Match($config, "(?m)^version = '([^']+)'")).Groups[1].Value
          if (!$version) { throw 'Missing Forge artifact version' }
          $file = "forge189/build/libs/ghostc-forge189-$version.jar"
          $revision = (& git rev-parse HEAD).Trim()
          $manifest = 'forge189/build/libs/GHOSTC_BUILD_MANIFEST.json'
          $sums = 'forge189/build/libs/SHA256SUMS.txt'
          python tools/forge_build_manifest.py create --jar $file --version $version --sha256sums $sums --manifest $manifest --revision $revision --platform windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows provenance generation failed' }
          python tools/forge_build_manifest.py verify --jar $file --sha256sums $sums --manifest $manifest --revision $revision --platform windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows provenance verification failed' }
      - name: Transactional install/collect/rollback rehearsal (fake profile, NO game launch)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ghostc-profile-fixture'
          $mods = Join-Path $root 'mods'
          New-Item -ItemType Directory -Path $mods -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root 'versions') -Force | Out-Null
          $previous = Join-Path $mods 'ghostc-forge189-0.9.0.jar'
          [IO.File]::WriteAllText($previous, 'OLDER OWNED GHOSTC TEST JAR')
          $priorHash = (Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash
          $config = Get-Content -LiteralPath 'forge189/build.gradle' -Raw
          $versionMatch = [regex]::Match($config, "(?m)^version = '([^']+)'")
          if (!$versionMatch.Success) { throw 'Cannot find current Forge artifact version' }
          $version = $versionMatch.Groups[1].Value
          $jar = (Resolve-Path "forge189/build/libs/ghostc-forge189-$version.jar").Path
          $hash = (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash
          $tool = (Resolve-Path 'tools/Invoke-GhostCAcceptance.ps1').Path
          $wrongHash = ('0' * 64)
          if ($wrongHash -eq $hash) { $wrongHash = ('F' * 64) }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Prepare -GameDir $root -JarPath $jar -ExpectedSha256 $wrongHash *> $null
          if ($LASTEXITCODE -eq 0 -or !(Test-Path -LiteralPath $previous) -or
              (Test-Path -LiteralPath (Join-Path $root 'ghostc-acceptance/install-state.json'))) {
            throw 'Wrong checksum was not safely rejected without changes'
          }
          $conflict = Join-Path $mods 'ghostc-unknown.jar'
          [IO.File]::WriteAllText($conflict, 'UNKNOWN GHOSTC FIXTURE')
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Prepare -GameDir $root -JarPath $jar -ExpectedSha256 $hash *> $null
          if ($LASTEXITCODE -eq 0 -or !(Test-Path -LiteralPath $previous)) {
            throw 'Duplicate named GhostC JAR was not safely rejected'
          }
          Remove-Item -LiteralPath $conflict

          # A junction at the *parent* backups directory is unsafe even when
          # its eventual transaction child is a normal directory.
          $outside = Join-Path $env:RUNNER_TEMP ('ghostc-external-backup-target-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $outside -Force | Out-Null
          $sentinel = Join-Path $outside 'DO_NOT_TOUCH.txt'
          [IO.File]::WriteAllText($sentinel, 'external owner data')
          $acceptDir = Join-Path $root 'ghostc-acceptance'
          New-Item -ItemType Directory -Path $acceptDir -Force | Out-Null
          $backupRoot = Join-Path $acceptDir 'backups'
          New-Item -ItemType Junction -Path $backupRoot -Target $outside | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Prepare -GameDir $root -JarPath $jar -ExpectedSha256 $hash *> $null
          if ($LASTEXITCODE -eq 0 -or !(Test-Path -LiteralPath $previous) -or
              (Test-Path -LiteralPath (Join-Path $acceptDir 'install-state.json')) -or
              !([IO.File]::ReadAllText($sentinel) -eq 'external owner data')) {
            throw 'Prepare followed an untrusted junction in acceptance backups'
          }
          [IO.Directory]::Delete($backupRoot, $false)
          if (!(Test-Path -LiteralPath $sentinel)) { throw 'Backup link cleanup altered external files' }
          Write-Output 'WINDOWS_ACCEPTANCE_BACKUP_JUNCTION_PREPARE_GUARD_PASS'
          Write-Output 'WINDOWS_ACCEPTANCE_NEGATIVE_PREFLIGHT_PASS'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Prepare -GameDir $root -JarPath $jar -ExpectedSha256 $hash
          if ($LASTEXITCODE -ne 0) { throw 'Prepare transaction failed' }
          $firstSession = (Get-Content -LiteralPath (Join-Path $root 'ghostc-acceptance/install-state.json') -Raw | ConvertFrom-Json).transaction
          if ((Test-Path -LiteralPath $previous) -or !(Test-Path -LiteralPath (Join-Path $root 'ghostc-acceptance/install-state.json'))) {
            throw 'Prepare failed to quarantine the old client safely'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Collect -GameDir $root
          if ($LASTEXITCODE -ne 0) { throw 'Collect evidence step failed' }
          $report = Join-Path $root 'ghostc-acceptance/acceptance-report.md'
          if (!(Test-Path -LiteralPath $report) -or
              ((Get-Content -LiteralPath $report -Raw) -notmatch 'UNVERIFIED IN-GAME') -or
              ((Get-Content -LiteralPath $report -Raw) -notmatch "Session transaction: $firstSession")) {
            throw 'Acceptance report missing disclaimer or session identity'
          }
          # A second Collect must never overwrite the human-owned checklist.
          $original = Get-Content -LiteralPath $report -Raw
          $edited = $original.Replace('- [ ] Launcher starts without a Forge loading error',
                                      '- [x] Launcher starts without a Forge loading error')
          $edited += "`nCI_FIXTURE_OWNER_NOTE_DO_NOT_ERASE`n"
          Set-Content -LiteralPath $report -Value $edited -Encoding UTF8
          $editedHash = (Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash
          $diagDir = Join-Path $root 'config/ghostc'
          New-Item -ItemType Directory -Path $diagDir -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $diagDir 'diagnostics-last.properties'),
            "count.gui_open=7`nperf.p95_fps=144`nusername=EXCLUDED_PRIVATE_VALUE`n")
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Collect -GameDir $root
          if ($LASTEXITCODE -ne 0) { throw 'Repeated Collect failed' }
          if ((Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash -ne $editedHash) {
            throw 'Repeated Collect erased the operator checklist or notes'
          }
          $telemetry = Get-Content -LiteralPath (Join-Path $root 'ghostc-acceptance/telemetry-latest.txt') -Raw
          if ($telemetry -notmatch 'count.gui_open=7' -or
              $telemetry -notmatch 'perf.p95_fps=144' -or
              $telemetry -match 'EXCLUDED_PRIVATE_VALUE') {
            throw 'Numeric diagnostics sidecar missing or privacy filtering failed'
          }
          Write-Output 'WINDOWS_ACCEPTANCE_PRESERVE_CHECKLIST_AND_TELEMETRY_PASS'
          $installed = Join-Path $mods "ghostc-forge189-$version.jar"

          # Simulate malicious backup-parent replacement after Prepare.
          # Rollback must refuse BEFORE removing any installed JAR.
          $heldBackups = Join-Path $acceptDir 'backups-held-safe'
          Move-Item -LiteralPath $backupRoot -Destination $heldBackups
          New-Item -ItemType Junction -Path $backupRoot -Target $outside | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Rollback -GameDir $root *> $null
          if ($LASTEXITCODE -eq 0 -or
              !(Test-Path -LiteralPath $installed) -or
              (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash -ne $hash -or
              !(Test-Path -LiteralPath (Join-Path $acceptDir 'install-state.json')) -or
              !([IO.File]::ReadAllText($sentinel) -eq 'external owner data')) {
            throw 'Rollback crossed a backup-root junction or mutated installed client'
          }
          $reportBefore = (Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Collect -GameDir $root *> $null
          if ($LASTEXITCODE -eq 0 -or
              (Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash -ne $reportBefore) {
            throw 'Collect followed a backup-root junction or changed acceptance evidence'
          }
          Write-Output 'WINDOWS_ACCEPTANCE_BACKUP_JUNCTION_COLLECT_GUARD_PASS'
          [IO.Directory]::Delete($backupRoot, $false)
          Move-Item -LiteralPath $heldBackups -Destination $backupRoot
          if (!(Test-Path -LiteralPath (Join-Path $backupRoot $firstSession 'ghostc-forge189-0.9.0.jar'))) {
            throw 'Unable to recover original backups after malicious junction fixture'
          }
          Write-Output 'WINDOWS_ACCEPTANCE_BACKUP_JUNCTION_ROLLBACK_GUARD_PASS'

          [IO.File]::AppendAllText($installed, 'TAMPERED FILE')
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Rollback -GameDir $root *> $null
          if ($LASTEXITCODE -eq 0 -or
              !(Test-Path -LiteralPath (Join-Path $root 'ghostc-acceptance/install-state.json'))) {
            throw 'Tampered installation did not block rollback'
          }
          Copy-Item -LiteralPath $jar -Destination $installed -Force
          if ((Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash -ne $hash) {
            throw 'Unable to restore test fixture before rollback'
          }
          Write-Output 'WINDOWS_ACCEPTANCE_TAMPER_GUARD_PASS'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Rollback -GameDir $root
          if ($LASTEXITCODE -ne 0) { throw 'Rollback transaction failed' }
          if (!(Test-Path -LiteralPath $previous) -or
              (Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash -ne $priorHash) {
            throw 'Rollback did not restore the original client byte-for-byte'
          }
          if ((Test-Path -LiteralPath (Join-Path $mods "ghostc-forge189-$version.jar")) -or
              (Test-Path -LiteralPath (Join-Path $root 'ghostc-acceptance/install-state.json'))) {
            throw 'Rollback left an active client or transaction state behind'
          }
          Write-Output 'WINDOWS_ACCEPTANCE_TRANSACTION_PASS'

          # Second Prepare with the SAME JAR/hash must still open a clean session.
          # Previous checked boxes and notes must be archived, not reused/erased.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Prepare -GameDir $root -JarPath $jar -ExpectedSha256 $hash
          if ($LASTEXITCODE -ne 0) { throw 'Second Prepare transaction failed' }
          $secondSession = (Get-Content -LiteralPath (Join-Path $root 'ghostc-acceptance/install-state.json') -Raw | ConvertFrom-Json).transaction
          if ($secondSession -eq $firstSession) { throw 'New Prepare reused old session identity' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Collect -GameDir $root
          if ($LASTEXITCODE -ne 0) { throw 'Second session Collect failed' }
          $freshReport = Get-Content -LiteralPath $report -Raw
          if ($freshReport -notmatch "Session transaction: $secondSession" -or
              $freshReport -notmatch 'UNVERIFIED IN-GAME' -or
              $freshReport -match 'CI_FIXTURE_OWNER_NOTE_DO_NOT_ERASE' -or
              $freshReport -match '\- \[x\] Launcher starts without a Forge loading error') {
            throw 'Old completed checkboxes or notes leaked into the new acceptance session'
          }
          $history = Join-Path $root 'ghostc-acceptance/history'
          $oldReports = @(Get-ChildItem -LiteralPath $history -Recurse -File -Filter 'acceptance-report.md')
          if ($oldReports.Count -ne 1 -or
              (Get-FileHash -LiteralPath $oldReports[0].FullName -Algorithm SHA256).Hash -ne $editedHash) {
            throw 'Previously completed report was not archived byte-for-byte'
          }
          $oldSidecars = @(Get-ChildItem -LiteralPath $history -Recurse -File -Filter 'telemetry-latest.txt')
          if ($oldSidecars.Count -ne 1 -or
              ((Get-Content -LiteralPath $oldSidecars[0].FullName -Raw) -notmatch "Session transaction: $firstSession")) {
            throw 'Old session telemetry was not archived with original report'
          }
          $freshHash = (Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Collect -GameDir $root
          if ($LASTEXITCODE -ne 0 -or
              (Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash -ne $freshHash) {
            throw 'Repeated Collect mutated the second session checklist'
          }
          Write-Output 'WINDOWS_ACCEPTANCE_SESSION_ISOLATION_PASS'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tool -Mode Rollback -GameDir $root
          if ($LASTEXITCODE -ne 0 -or
              (Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash -ne $priorHash) {
            throw 'Second session rollback did not restore prior client'
          }
          Write-Output 'WINDOWS_ACCEPTANCE_REPEATED_ROLLBACK_PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: ghostc-forge189-windows-build-unverified-ingame
          path: |
            forge189/build/libs/ghostc-forge189-*.jar
            forge189/build/libs/SHA256SUMS.txt
            forge189/build/libs/GHOSTC_BUILD_MANIFEST.json
            tools/forge_build_manifest.py
            tools/verify_forge_jar.py
            tools/Invoke-GhostCAcceptance.ps1
            docs/RUNTIME_R10.md
            docs/RUNTIME_R15.md
            docs/RUNTIME_R16.md
            docs/RUNTIME_R23.md
            docs/RUNTIME_R55.md
          if-no-files-found: error
